name: "Release"
run-name: "Release ${{ github.sha }} to healthcheck.vexl.it"

on:
  workflow_dispatch:
    inputs:
      create_infra_pr:
        description: "Open a release PR in the infrastructure repo"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: privacy-prescription-plan
  IMAGE_TAG: prod-${{ github.sha }}

jobs:
  build-image:
    name: Build and push image
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6
        with:
          role-to-assume: arn:aws:iam::570620554963:role/github_actions_ecr_vexl
          role-session-name: GithubActionsPrivacyPrescriptionPlan
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build and push image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  infra-release-pr:
    name: Open infrastructure release PR
    runs-on: ubuntu-latest
    if: ${{ inputs.create_infra_pr }}
    needs:
      - build-image
    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: vexl-it/infrastructure
          token: ${{ secrets.INFRASTRUCTURE_REPOSITORY_TOKEN }}

      - name: Update manifest image tag
        run: |
          yq -i '.spec.template.spec.containers[0].image |= sub(":[^:/]+$"; ":" + strenv(IMAGE_TAG))' \
            prod/manifests/websites/privacy-prescription-plan/deployment.yaml

      - name: Create release PR
        env:
          GH_TOKEN: ${{ secrets.INFRASTRUCTURE_REPOSITORY_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "::notice::manifest already points to $GITHUB_SHA — nothing to release"
            exit 0
          fi
          short_sha="${GITHUB_SHA::7}"
          branch="release/privacy-prescription-plan-${short_sha}"
          title="Release privacy-prescription-plan ${short_sha} to production"
          body="$(printf 'Updates healthcheck.vexl.it to the image built from %s@%s.\n\nOpened by Release: %s/%s/actions/runs/%s' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -b "$branch"
          git commit -am "$title"
          git push -f origin "$branch"
          if ! gh pr view "$branch" --json url -q .url 2>/dev/null; then
            gh pr create --base master --head "$branch" --title "$title" --body "$body"
          fi
